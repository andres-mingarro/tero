<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="siriwave.umd.js"></script>
<style>
  html, body {
    margin: 0;
    background: transparent;
    overflow: hidden;
    {# background: #000000; #}
  }

  #boca-wrapper {
    position: relative;
    width: 260px;
    height: 74px;
    overflow: hidden;
  }

  #onda-wrapper {
    position:relative;
  }

  #onda {
    width: 260px;
    height: 74px;
    position: relative;
    z-index: 1;
  }
  #info {
    position: absolute;
    left: 0;
    bottom: 23px;
    right: 0;
    height: 12px;
    box-sizing: border-box;
    padding: 0 10px;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #info.visible {
    opacity: 0.7;
  }
  #cancion {
    color: rgba(255, 255, 255, 0.8);
    font: 11px -apple-system, "Segoe UI", sans-serif;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 0 6px rgba(0,0,0,0.6);
    margin-bottom: 3px;
  }
  #fila-progreso {
    display: flex;
    align-items: center;
    gap: 6px;
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 39px;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #fila-progreso.visible {
    opacity: 1;
  }
  #fila-progreso span {
    color: rgba(255, 255, 255, 0.55);
    font: 9px -apple-system, "Segoe UI", sans-serif;
    text-shadow: 0 0 4px rgba(0,0,0,0.6);
    min-width: 26px;
  }
  #tiempo-actual { text-align: right; margin-top: -12px; }
  #tiempo-total { text-align: left; margin-top: -12px;}
  /* Barra de luz: adaptada de un diseño que pasó el usuario (gradiente
     animado + brillo "respirando" + puntas achaflanadas). El chaflán
     original era de 16px para una barra de 520px -- acá se achica a 3px
     (mismo alto que la barra) para que no se vea como un rombo en algo
     tan chico. */
  @property --glow {
    syntax: "<color>";
    inherits: false;
    initial-value: #168fe9;
  }
  #barra {
    flex: 1;
    height: 1px;
    position: relative;
    background: transparent;
    overflow: visible;
  }
  #barra::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0);
    clip-path: polygon(0 50%, 3px 0, calc(100% - 3px) 0, 100% 50%, calc(100% - 3px) 100%, 3px 100%);
  }
  #barra-relleno {
    height: 100%;
    width: 0%;
    /* Sin esto, al cambiar de canción el ancho salta de golpe (de donde
       había quedado la anterior a ~0% de la nueva) y el puntito de luz
       "se apaga y prende" de un frame al otro en vez de deslizarse. */
    transition: width 0.25s ease;
    position: relative;
    {# clip-path: polygon(0 50%, 3px 0, calc(100% - 3px) 0, 100% 50%, calc(100% - 3px) 100%, 3px 100%); #}
    background: linear-gradient(90deg,
      #168fe9 0%, #20dba5 17%, #f33f64 34%, #ffffff 42%,
      #26e993 50%, #2668db 67%, #168fe9 84%, #20dba5 100%
    );
    background-size: 300% 100%;
    filter: drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 8px var(--glow));
    background: #ffffffa6;
    border-radius: 100%;
    opacity: 1;
    animation:
      barra-color-flow 4s linear infinite,
      barra-glow-color 4s linear infinite,
      barra-respira 1.8s ease-in-out infinite;
  }
  /* En pausa: se congela el color/brillo animado de la barra, y el
     puntito de luz late en rojo con el centro blanco -- como un
     "corazón" pulsando, para que se note de un vistazo que está pausado. */
  #barra-relleno.pausado {
    animation-play-state: paused;
    filter: drop-shadow(0 0 3px #ff4d4d) drop-shadow(0 0 8px #ff4d4d);
  }
  #barra-relleno.pausado::after {
    animation: punto-pulso 2.2s ease-in-out infinite;
  }
  @keyframes punto-pulso {
    0%, 100% {
      background: #fff;
      box-shadow: 0 0 2px 1px #fff, 0 0 6px 2px #22c55e;
    }
    50% {
      background: #22c55e;
      box-shadow: 0 0 3px 1px #22c55e, 0 0 9px 3px #22c55e;
    }
  }
  /* Puntito de luz en la punta del progreso, un poco más fuerte que el
     resto de la barra pero sin llamar demasiado la atención. */
  #barra-relleno::after {
    content: "";
    position: absolute;
    right: -1px;
    top: 50%;
    width: 4px;
    height: 2px;
    transform: translateY(-50%);
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 3px 1px rgba(255, 255, 255, 0.85), 0 0 7px 2px var(--glow);
  }
  @keyframes barra-respira {
    50% {
      filter: brightness(1.25) drop-shadow(0 0 4px var(--glow)) drop-shadow(0 0 11px var(--glow));
    }
  }
  @keyframes barra-color-flow {
    to { background-position: -300% 0; }
  }
  @keyframes barra-glow-color {
    0%, 100% { --glow: #168fe9; }
    25% { --glow: #20dba5; }
    42% { --glow: #f33f64; }
    52% { --glow: #ffffff; }
    68% { --glow: #26e993; }
    84% { --glow: #2668db; }
  }
  @media (prefers-reduced-motion: reduce) {
    #barra-relleno { animation: none; }
  }
</style>
</head>
<body>
  <div id="boca-wrapper">

    <div id="onda-wrapper">
      <div id="onda"></div>
      <div id="fila-progreso">
        <span id="tiempo-actual">0:00</span>
        <div id="barra"><div id="barra-relleno"></div></div>
        <span id="tiempo-total">0:00</span>
      </div>
    </div>
    <div id="info">
      <div id="cancion"></div>
    </div>
  </div>
<script>
// Es render, no IA: RMS -> amplitud de la onda, con suavizado asimétrico
// propio (ataque rápido, decaimiento lento) antes de pasárselo a SiriWave
// (que además tiene su propio lerp interno, así que queda doblemente
// suave). El RMS crudo tiembla -- esto es lo que separa "se ve pro" de
// "se ve amateur".

const COLORES = {
  idle:        "#4a4458",
  escuchando:  "#ffffff",
  pensando:    "#c77dff",
  hablando:    "#7c5cff",
  musica:      "#5cffd4",
};

const AMPLITUD_IDLE = 0.15;
const AMPLITUD_PENSANDO = 0.45;

const wave = new SiriWave({
  container: document.getElementById("onda"),
  style: "ios9",
  color: "#7c5cff",
  speed: 0.06,
  amplitude: AMPLITUD_IDLE,
  autostart: true,
});

let estado = "idle";
let nivelCrudo = 0;
let nivelSuave = AMPLITUD_IDLE;

const ATAQUE = 0.7;       // qué tan rápido sube la amplitud al hablar
const DECAIMIENTO = 0.25; // más rápido que antes (0.08): con eso la onda
                          // quedaba "abierta" en los silencios entre
                          // palabras, se veía desacoplada del audio real.

function amplitudObjetivo() {
  // "escuchando" también sigue el nivel real -- ahora es el mic en vivo,
  // no un valor fijo (así se ve mover con la voz del usuario).
  if (estado === "hablando" || estado === "musica" || estado === "escuchando") return nivelCrudo;
  if (estado === "pensando") return AMPLITUD_PENSANDO;
  return AMPLITUD_IDLE;
}

function animar() {
  const objetivo = amplitudObjetivo();
  const tasa = objetivo > nivelSuave ? ATAQUE : DECAIMIENTO;
  nivelSuave += (objetivo - nivelSuave) * tasa;
  wave.setAmplitude(nivelSuave);
  // La velocidad de la onda también sigue el nivel: antes era fija
  // mientras hablaba, y una onda moviéndose siempre igual sin importar
  // qué tan fuerte suena la voz es justo lo que se veía desacoplado.
  if (estado === "hablando" || estado === "musica" || estado === "escuchando") {
    wave.setSpeed(0.04 + nivelSuave * 0.18);
  }
  requestAnimationFrame(animar);
}
requestAnimationFrame(animar);

// Mutter no respeta "siempre encima" de forma persistente: si el usuario
// foca otra ventana mientras Tero habla, la boca cae atrás igual aunque
// se haya traído al frente al empezar. Como no hay layer-shell, se
// reintenta a repetición mientras dura el habla, no solo una vez al
// arrancar -- molesto pero es lo que hay sin tocar el compositor.
let intervaloFrente = null;

function empezarATraerAlFrente() {
  if (intervaloFrente !== null || !window.pywebview) return;
  window.pywebview.api.traer_al_frente();
  intervaloFrente = setInterval(() => {
    window.pywebview.api.traer_al_frente();
  }, 400);
}

function dejarDeTraerAlFrente() {
  if (intervaloFrente !== null) {
    clearInterval(intervaloFrente);
    intervaloFrente = null;
  }
}

// El estilo "ios9" de SiriWave ignora el color pasado al constructor: trae
// sus curvas hardcodeadas en azul/rojo/verde (ver iOS9Curve.getDefinition()
// en siriwave.umd.js) y las dibuja con su propio color fijo, no con el de
// la instancia. Por eso cambiar COLORES/el drop-shadow de afuera nunca
// pintaba la onda en sí -- solo el brillo alrededor. Acá se recolorean a
// mano las curvas reales (menos la "support line" blanca de fondo, que se
// deja como viene) cada vez que cambia el estado.
function hexARgb(hex) {
  const n = parseInt(hex.replace("#", ""), 16);
  return `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}`;
}

// Colores originales de la librería (multicolor: azul/rojo/verde) para
// poder restaurarlos en "hablando" -- al usuario le gusta ese look
// mientras Tero habla, y solo ese, así que es el único estado que no se
// fuerza a un color plano.
const COLORES_ORIGINALES_CURVAS = wave.curves.map((c) => c.definition.color);

function aplicarEstado(nuevo) {
  const eraHablando = estado === "hablando";
  estado = nuevo;
  wave.setSpeed(estado === "pensando" ? 0.12 : 0.06);
  const color = COLORES[estado] || COLORES.idle;
  document.getElementById("onda").style.filter =
    `drop-shadow(0 0 12px ${color})`;
  if (estado === "hablando") {
    wave.curves.forEach((curva, i) => {
      curva.definition.color = COLORES_ORIGINALES_CURVAS[i];
    });
  } else {
    const rgb = hexARgb(color);
    for (const curva of wave.curves) {
      if (!curva.definition.supportLine) curva.definition.color = rgb;
    }
  }
  if (estado === "hablando" && !eraHablando) {
    empezarATraerAlFrente();
  } else if (estado !== "hablando" && eraHablando) {
    dejarDeTraerAlFrente();
  }
}
// Recién acá es seguro llamarla: ya existen COLORES_ORIGINALES_CURVAS y
// hexARgb. Llamarla más arriba, antes de que el const se declare, tira un
// ReferenceError de TDZ que corta en seco el resto del script (incluido
// el WebSocket y el loop de animación) -- pasó de verdad, por eso la
// onda quedaba congelada y sin recolorear nunca.
aplicarEstado("idle");

// Progreso interpolado: el poll de Spotify llega cada ~5s, pero la
// canción avanza continuamente. En vez de saltar cada 5s, se guarda el
// progreso recibido + cuándo llegó, y cada frame se calcula dónde debería
// estar "ahora" asumiendo que sigue sonando -- el próximo poll corrige
// cualquier desvío (pausa, salto de tema) solo.
let progresoBase = 0;
let duracionMs = 0;
let momentoRecibido = 0;
let reproduciendoAlgo = false;
let pausado = false;

function formatearTiempo(ms) {
  const totalSeg = Math.max(0, Math.floor(ms / 1000));
  const min = Math.floor(totalSeg / 60);
  const seg = totalSeg % 60;
  return `${min}:${String(seg).padStart(2, "0")}`;
}

function aplicarCancion(info) {
  const elInfo = document.getElementById("info");
  const elProgreso = document.getElementById("fila-progreso");
  if (!info) {
    // Los segundos transcurridos/restantes viven en #fila-progreso, un
    // bloque aparte de #info -- ocultar solo #info dejaba el tiempo (y la
    // barra) visibles para siempre. Se ocultan los dos juntos.
    reproduciendoAlgo = false;
    elInfo.classList.remove("visible");
    elProgreso.classList.remove("visible");
    return;
  }
  document.getElementById("cancion").textContent = info.texto;
  progresoBase = info.progreso_ms;
  duracionMs = info.duracion_ms;
  momentoRecibido = performance.now();
  reproduciendoAlgo = true;
  pausado = !info.reproduciendo;
  document.getElementById("barra-relleno").classList.toggle("pausado", pausado);
  elInfo.classList.add("visible");
  elProgreso.classList.add("visible");
}

function animarProgreso() {
  if (reproduciendoAlgo && duracionMs > 0) {
    // En pausa no se suma tiempo transcurrido: el progreso queda
    // congelado en lo último que reportó Spotify, no sigue avanzando.
    const transcurridoReal = pausado ? 0 : performance.now() - momentoRecibido;
    const progresoMs = Math.min(duracionMs, progresoBase + transcurridoReal);
    document.getElementById("barra-relleno").style.width =
      `${(progresoMs / duracionMs) * 100}%`;
    document.getElementById("tiempo-actual").textContent = formatearTiempo(progresoMs);
    document.getElementById("tiempo-total").textContent = formatearTiempo(duracionMs);
  }
  requestAnimationFrame(animarProgreso);
}
requestAnimationFrame(animarProgreso);

function conectar() {
  const ws = new WebSocket("ws://127.0.0.1:8765");
  ws.onmessage = (ev) => {
    const datos = JSON.parse(ev.data);
    if (datos.estado !== undefined) aplicarEstado(datos.estado);
    if (datos.nivel !== undefined) nivelCrudo = datos.nivel;
    if (datos.cancion !== undefined) aplicarCancion(datos.cancion);
  };
  ws.onclose = () => setTimeout(conectar, 1000);
  ws.onerror = () => ws.close();
}
conectar();
</script>
</body>
</html>
