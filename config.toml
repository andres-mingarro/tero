[tecla]
# Nombre de tecla evdev (ver: python -c "from evdev import ecodes; print([k for k in dir(ecodes) if k.startswith('KEY_')])")
nombre = "KEY_RIGHTCTRL"
# Umbral en segundos: por debajo es un toque corto (toggle), por encima push-to-talk.
umbral_toggle_s = 0.35

[audio]
muestreo_hz = 16000
canales = 1

[stt]
# "large-v3": preferimos precisión sobre latencia. El problema de nombres
# mal entendidos no es de una ciudad puntual, va a aparecer todo el tiempo
# con cualquier nombre propio — mejor resolverlo de raíz que a pistas.
modelo = "large-v3"
device = "auto"
compute_type = "default"

[tts]
voz = "es_AR-daniela-high"

[cerebro]
modelo = "qwen3:4b-instruct"

[spotify]
# App creada en https://developer.spotify.com/dashboard, solo Web API.
# No es secreto: un client_id de app pública (PKCE) no requiere ocultarse.
client_id = "5402ca5c0ce646a29462c39eed5b91ea"
